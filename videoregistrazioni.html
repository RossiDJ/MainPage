<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Registrazioni - Rossi DJ</title>
    <script src="//widget.mixcloud.com/media/js/widgetApi.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-image: url('flx10live1.jpg'); background-size: cover; background-position: center; z-index: -1; animation: respiroSfondo 20s ease-in-out infinite alternate; }
        @keyframes respiroSfondo { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }

        header { width: 100%; padding: 20px 0; background: rgba(0, 0, 0, 0.75); text-align: center; border-bottom: 2px solid #00d4ff; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); position: relative; z-index: 1; }
        .nav-buttons { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
        .btn-nav { padding: 10px 20px; background: #ff9900; color: #fff; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 0.9rem; }
        
        .container { width: 90%; max-width: 800px; margin: 20px auto; background: rgba(0, 0, 0, 0.75); padding: 25px; border-radius: 20px; border: 1px solid #444; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); position: relative; z-index: 1; }
        
        .section-box { background: rgba(0, 0, 0, 0.5); border: 1px solid #444; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        
        .grid { display: flex; flex-direction: column; gap: 30px; margin-top: 20px; }
        .card { background: rgba(0, 0, 0, 0.6); padding: 15px; border-radius: 12px; border: 1px solid #444; text-align: center; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; width: 100%; box-sizing: border-box; }
        .card:hover { border-color: #00d4ff; background: rgba(0, 0, 0, 0.8); }
        .card-title { font-size: 1.2rem; margin-bottom: 15px; color: #00d4ff; font-weight: bold; word-wrap: break-word; text-transform: uppercase; }
        
        /* Modifiche Layout Player per Fullscreen */
        .player-wrapper { position: relative; width: 100%; display: flex; flex-direction: column; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #333; margin-bottom: 10px; }
        .player-wrapper .video-container { border: none; margin-bottom: 0; border-radius: 0; width: 100%; }
        .player-wrapper .widget-container { margin-top: 0; border-radius: 0; width: 100%; }

        .btn-fullscreen { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); color: #fff; border: 1px solid #00d4ff; padding: 8px 12px; border-radius: 5px; cursor: pointer; z-index: 10; font-weight: bold; transition: 0.2s; }
        .btn-fullscreen:hover { background: #00d4ff; color: #000; }
        
        /* Controlli UI e Pannello DJ */
        .btn { padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; margin: 5px; background: #00d4ff; color: #000; }
        .btn-danger { background: #ff0055; color: #fff; }
        .btn-success { background: #ff9900; color: #fff; }
        input, textarea { padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; margin: 5px; width: calc(100% - 20px); box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        
        #admin-panel { border: 2px solid #ff0055; padding: 15px; margin-top: 20px; display: none; background: rgba(0, 0, 0, 0.85); border-radius: 10px; }
        .admin-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #444; text-align: left; flex-wrap: wrap; gap: 10px;}
        .admin-actions { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

        video { pointer-events: none; width: 100%; display: block; }
    </style>
</head>
<body>

    <header>
        <h1 style="color:#00d4ff; margin:0; text-transform: uppercase;">🎧 Video Registrazioni</h1>
        <div class="nav-buttons">
            <a href="index.html" class="btn-nav" style="background-color: #ff9900; color: #fff;">🏠 Home</a>
            <a href="registrazioni.html" class="btn-nav" style="background-color: #ff0055;">🎵 Solo Audio</a>
        </div>
    </header>

    <div class="container">
        
        <div style="text-align: right; margin-bottom: 15px;">
            <input type="password" id="adminPass" placeholder="Password DJ" style="width: 200px; display: inline-block;">
            <button class="btn btn-danger" onclick="checkAdmin()">Pannello DJ</button>
        </div>
        
        <div id="admin-panel">
            <h2 style="color:#ff0055; margin-top:0;">⚙️ Gestione VideoRegistrazioni</h2>
            <div class="section-box">
                <h4>Aggiungi Nuovo Set Video</h4>
                <input type="text" id="newTitle" placeholder="Titolo del set (es. Live set @ Discoteca)">
                <input type="text" id="newVideoUrl" placeholder="URL diretto del Video MP4 (es. https://.../video.mp4)">
                <textarea id="newEmbed" placeholder="Incolla qui il codice Embed (<iframe>) di Mixcloud"></textarea>
                <input type="number" id="newOffset" placeholder="Regolazione ritardo (usa - per anticipare)" step="0.1" value="0">
                <button class="btn btn-success" onclick="aggiungiVideoRegistrazione()">Pubblica Set</button>
            </div>
            <h3>Elenco VideoRegistrazioni</h3>
            <div id="admin-list">Nessuna registrazione presente.</div>
        </div>

        <div class="section-box">
            <h3 style="text-align: center; color: #00d4ff; margin-top:0;">Guarda e ascolta i set precedenti</h3>
            <div id="registrazioni-grid" class="grid">
                <p style="text-align: center; color: #888;">Caricamento set in corso...</p>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, get, child, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAXFX5kkba800EX9lowCg3os6Ifn2rzd8M", authDomain: "rossidj-chat.firebaseapp.com", databaseURL: "https://rossidj-chat-default-rtdb.europe-west1.firebasedatabase.app", projectId: "rossidj-chat", storageBucket: "rossidj-chat.firebasestorage.app", messagingSenderId: "247840582286", appId: "1:247840582286:web:5320cff622ffc8ab9377df" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let regData = {};
    const widgets = {}; // riferimenti ai player Mixcloud, per poterli sincronizzare col video

    onValue(ref(db, 'videoregistrazioni'), (snap) => {
        regData = snap.val() || {};
        renderPublic();
        renderAdminList();
    });

    function estraiSrcDaIframe(iframeString) {
        const match = iframeString.match(/src="([^"]+)"/);
        return match ? match[1] : null;
    }

    function renderPublic() {
        const grid = document.getElementById('registrazioni-grid');
        grid.innerHTML = '';
        
        const keys = Object.keys(regData).reverse();
        
        if (keys.length === 0) {
            grid.innerHTML = '<p style="text-align: center; color: #888;">Nessun video disponibile al momento.</p>';
            return;
        }

        keys.forEach(id => {
            const item = regData[id];
            const offset = item.offset || 0;
            
            let url = item.src;
            if (url && url.includes('mixcloud.com')) {
                // Mixcloud reindirizza www.mixcloud.com/widget/... a m.mixcloud.com
                // sui dispositivi mobile/riconosciuti come "vecchi", e quel redirect
                // va spesso in errore mostrando solo il logo + link di fallback.
                // Puntando direttamente al sottodominio del player si evita il redirect.
                url = url.replace('https://www.mixcloud.com', 'https://player-widget.mixcloud.com')
                         .replace('https://mixcloud.com', 'https://player-widget.mixcloud.com');
                if (!url.includes('hide_cover=1')) {
                    url += (url.includes('?') ? '&' : '?') + 'hide_cover=1';
                }
            }

            const safeIframe = `<iframe id="mixcloud-${id}" width="100%" height="120" src="${url}" frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" playsinline webkit-playsinline></iframe>`;
            
            grid.innerHTML += `
                <div class="card">
                    <div class="card-title">${item.title}</div>
                    
                    <div class="player-wrapper" id="wrapper-${id}">
                        <button class="btn-fullscreen" onclick="fullscreenVideo('${id}')">🔲 Schermo Intero (Video)</button>
                        
                        <div class="video-container">
                            <video id="video-${id}" data-offset="${offset}" muted playsinline preload="auto">
                                <source src="${item.videoUrl}" type="video/mp4">
                            </video>
                        </div>

                        <div class="widget-container">
                            ${safeIframe}
                        </div>
                    </div>
                </div>`;
        });

        setTimeout(() => {
            keys.forEach(id => {
                const video = document.getElementById(`video-${id}`);
                const iframe = document.getElementById(`mixcloud-${id}`);
                
                if (video && iframe && typeof Mixcloud !== 'undefined') {
                    const widget = Mixcloud.PlayerWidget(iframe);
                    widgets[id] = widget;
                    attachFullscreenSync(video, id);
                    
                    widget.ready.then(function() {
                        widget.events.play.on(() => {
                            const videoOffset = parseFloat(video.getAttribute('data-offset')) || 0;
                            if (videoOffset >= 0) video.play(); 
                        });
                        
                        widget.events.pause.on(() => video.pause());
                        
                        widget.events.progress.on((position) => {
                            const videoOffset = parseFloat(video.getAttribute('data-offset')) || 0;
                            const syncTime = position + videoOffset;

                            if (syncTime <= 0) {
                                if (Math.abs(video.currentTime - 0) > 0.1) video.currentTime = 0;
                                if (!video.paused) video.pause();
                            } else {
                                if (video.paused) video.play();
                                if (Math.abs(video.currentTime - syncTime) > 0.5) {
                                    video.currentTime = syncTime;
                                }
                            }
                        });
                        
                        widget.events.ended.on(() => {
                            video.pause();
                            video.currentTime = 0;
                        });
                    });
                }
            });
        }, 500); 
    }

    function renderAdminList() {
        const adminList = document.getElementById('admin-list');
        adminList.innerHTML = '';
        const keys = Object.keys(regData).reverse();
        if (keys.length === 0) {
            adminList.innerHTML = '<p>Nessuna registrazione.</p>';
            return;
        }
        keys.forEach(id => {
            const item = regData[id];
            const currentOffset = item.offset || 0;
            adminList.innerHTML += `
                <div class="admin-row">
                    <div style="flex-grow: 1;"><strong>${item.title}</strong></div>
                    <div class="admin-actions">
                        <input type="number" id="editOffset-${id}" value="${currentOffset}" step="0.1" style="width: 70px; padding: 5px; margin: 0;">
                        <button class="btn btn-success" style="padding: 5px 10px; margin: 0;" onclick="aggiornaOffset('${id}')">Salva</button>
                        <button class="btn btn-danger" style="padding: 5px 10px; margin: 0;" onclick="eliminaRegistrazione('${id}')">🗑️</button>
                    </div>
                </div>`;
        });
    }

    // Schermo Intero SOLO per il video Cloudflare (l'audio Mixcloud continua
    // a suonare in sottofondo, non essendo lui a entrare in fullscreen).
    // Su iOS (iPhone/iPad) usiamo webkitEnterFullscreen, l'unica API di
    // fullscreen per <video> davvero affidabile su Safari, anche datato.
    window.fullscreenVideo = (id) => {
        const video = document.getElementById(`video-${id}`);
        if (!video) return;
        if (video.webkitEnterFullscreen) { // iPhone/iPad Safari
            video.webkitEnterFullscreen();
        } else if (video.requestFullscreen) {
            video.requestFullscreen().catch(() => {});
        } else if (video.webkitRequestFullscreen) {
            video.webkitRequestFullscreen();
        }
    };

    // Quando il video è a schermo intero, mostriamo i controlli nativi
    // (play/pausa/barra di scorrimento). Se l'utente sposta la barra,
    // spostiamo anche l'audio Mixcloud sullo stesso punto per restare sincronizzati.
    function attachFullscreenSync(video, id) {
        const entraFullscreen = () => {
            video.controls = true;
            video.style.pointerEvents = 'auto';
        };
        const esceFullscreen = () => {
            video.controls = false;
            video.style.pointerEvents = 'none';
        };

        video.addEventListener('webkitbeginfullscreen', entraFullscreen); // iOS
        video.addEventListener('webkitendfullscreen', esceFullscreen);    // iOS
        video.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement === video) entraFullscreen();
            else esceFullscreen();
        });

        video.addEventListener('seeked', () => {
            if (!video.controls) return; // ignora i riposizionamenti automatici di sync
            const widget = widgets[id];
            if (!widget) return;
            const offset = parseFloat(video.getAttribute('data-offset')) || 0;
            const mixcloudTime = Math.max(0, video.currentTime - offset);
            widget.seek(mixcloudTime);
        });
    }

    // Ascolta l'uscita tramite tasto ESC (desktop)
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            document.querySelectorAll('video').forEach(v => {
                v.controls = false;
                v.style.pointerEvents = 'none';
            });
        }
    });

    // Funzioni Admin
    window.checkAdmin = () => {
        const inputPass = document.getElementById('adminPass').value;
        get(child(ref(db), 'settings/adminPass')).then((snapshot) => {
            if(snapshot.exists() && snapshot.val() === inputPass) {
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                alert("Password DJ errata!");
            }
        }).catch(err => {
            console.error("Errore recupero password: ", err);
        });
    };

    window.aggiungiVideoRegistrazione = () => {
        const title = document.getElementById('newTitle').value.trim();
        const videoUrl = document.getElementById('newVideoUrl').value.trim();
        const embedCode = document.getElementById('newEmbed').value.trim();
        const offsetVal = parseFloat(document.getElementById('newOffset').value) || 0;
        
        if (!title || !embedCode || !videoUrl) return alert("Inserisci il titolo, il link del video e il codice embed!");
        const src = estraiSrcDaIframe(embedCode);
        if (!src) return alert("Il codice embed non è valido.");

        push(ref(db, 'videoregistrazioni'), { title: title, src: src, videoUrl: videoUrl, offset: offsetVal })
            .then(() => {
                alert("VideoRegistrazione pubblicata!");
                document.getElementById('newTitle').value = '';
                document.getElementById('newVideoUrl').value = '';
                document.getElementById('newEmbed').value = '';
                document.getElementById('newOffset').value = '0';
            });
    };

    window.aggiornaOffset = (id) => {
        const nuovoOffset = parseFloat(document.getElementById(`editOffset-${id}`).value) || 0;
        update(ref(db, `videoregistrazioni/${id}`), { offset: nuovoOffset })
            .then(() => console.log("Ritardo aggiornato con successo"))
            .catch(e => alert("Errore durante l'aggiornamento: " + e.message));
    };

    window.eliminaRegistrazione = (id) => {
        if (confirm("Vuoi eliminare questa video registrazione?")) remove(ref(db, `videoregistrazioni/${id}`));
    };
</script>
</body>
</html>
