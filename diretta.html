<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>In Diretta - Rossi DJ</title>
    <style>
        /* --- STILI BASE E LAYOUT SPLIT --- */
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background-color: #000; color: #fff; overflow: hidden; }
        
        /* Layout principale che gestisce lo spazio tra video e chat */
        .main-layout { display: flex; height: 100%; width: 100%; flex-direction: row; }
        
        /* --- PARTE SINISTRA: PLAYER --- */
        .player-section { flex: 7; position: relative; background-color: #000; border-right: 2px solid #ff0055; }
        
        /* Contenitore principale del video (quello che va in Fullscreen) */
        #video-wrapper { position: relative; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        /* --- LA MAGIA DEL CROPPING (Ritaglio) --- */
        /* Questo contenitore fa da "forbice": tutto ciò che esce dai suoi bordi diventa invisibile */
        #iframe-cropper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
        
        /* Spostiamo l'iframe in alto e a sinistra per nascondere l'header e la chat originale di Mixcloud */
        #live-frame { 
            position: absolute; 
            top: -65px; /* Taglia via i 65px del menu superiore di Mixcloud */
            left: 0; 
            width: calc(100% + 350px); /* Allarga l'iframe per spingere la chat originale fuori dallo schermo a destra */
            height: calc(100% + 65px); /* Compensa lo spostamento in alto */
            border: none; 
            z-index: 1; 
            display: none; 
        }

        /* Schermata Offline (Sopra l'iframe) */
        #offline-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('flx10live1.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; z-index: 5; flex-direction: column; }
        .offline-box { background: rgba(0,0,0,0.8); padding: 30px; border-radius: 20px; border: 2px solid #ff0055; text-align: center; backdrop-filter: blur(5px); }

        /* Bottoni Overlay Base in alto a sinistra e destra */
        .btn-home { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: #00d4ff; text-decoration: none; font-size: 1.5rem; padding: 10px; border-radius: 50%; border: 2px solid #00d4ff; z-index: 10; transition: 0.3s; line-height: 1; }
        .btn-mixcloud { position: absolute; top: 15px; left: 75px; background: rgba(0,0,0,0.6); color: #fff; text-decoration: none; padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); z-index: 10; font-weight: bold; display: none; }
        .btn-fullscreen-toggle { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 8px 15px; border-radius: 8px; cursor: pointer; z-index: 10; font-weight: bold; }
        
        .fullscreen-active .hide-in-fs { display: none !important; }

        /* --- UI IN FULLSCREEN --- */
        #fs-overlay { display: none; position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        
        /* Ultimi 2 messaggi senza sfondo */
        #fs-chat-display { position: absolute; bottom: 90px; left: 20px; width: 70%; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
        .fs-msg-mini { background: transparent; color: #fff; text-shadow: 2px 2px 5px rgba(0,0,0,1), -1px -1px 3px rgba(0,0,0,1); font-size: 1.2rem; font-weight: bold; line-height: 1.4; animation: fadeIn 0.3s ease-in-out; }
        .fs-msg-mini strong { color: #00d4ff; }

        /* Chat Completa In Fullscreen (Solo testo, senza sfondo) */
        #fs-full-chat-overlay { display: none; position: absolute; top: 15%; left: 20px; width: 60%; height: 60%; overflow-y: auto; pointer-events: auto; padding: 10px; flex-direction: column; gap: 8px; background: transparent; }
        .fs-full-msg { background: transparent; text-shadow: 2px 2px 5px rgba(0,0,0,1), -1px -1px 3px rgba(0,0,0,1); font-size: 1.1rem; color: #fff; }
        .fs-full-msg strong { color: #ff0055; }

        /* Controlli Fullscreen in basso */
        .fs-controls-bottom { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: auto; }
        .fs-btn-circle { background: rgba(0,0,0,0.7); color: #fff; border: 2px solid #fff; font-size: 1.5rem; padding: 12px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
        .fs-btn-circle:hover { background: #ff0055; border-color: #ff0055; }
        
        #fs-input-box { display: none; background: rgba(0,0,0,0.85); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.3); align-items: center; gap: 8px; width: calc(100% - 130px); margin-left: 10px; }
        #fs-input-text { flex: 1; padding: 12px; border-radius: 10px; border: none; outline: none; font-size: 1rem; }
        #fs-btn-send { background: #00d4ff; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* --- PARTE DESTRA: CHAT LATERALE (Desktop) --- */
        .chat-section { flex: 3; background-color: rgba(18, 18, 18, 0.95); display: flex; flex-direction: column; position: relative; min-width: 320px; border-left: 2px solid #ff0055; }
        .chat-header { padding: 15px; background: rgba(0,0,0,0.8); text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); color: #00d4ff; font-weight: bold; letter-spacing: 1px; }
        #messages-sidebar { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .side-msg { background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; border-left: 3px solid #00d4ff; font-size: 0.9rem; word-break: break-word; }
        .side-msg strong { color: #00d4ff; display: block; font-size: 0.8rem; margin-bottom: 3px; }
        
        .chat-input-area { padding: 15px; background: rgba(0,0,0,0.8); border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; flex-shrink: 0; }
        #side-input-text { flex: 1; padding: 15px; border-radius: 10px; border: none; background: #222; color: #fff; font-size: 1rem; }
        #side-btn-send { background: #ff0055; color: #fff; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* --- MOBILE VERTICALE --- */
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            /* Altezza fissa percentuale: risolve il bug della chat invisibile e della tastiera */
            .player-section { flex: 0 0 38%; height: 38%; width: 100%; border-right: none; border-bottom: 2px solid #ff0055; }
            .chat-section { flex: 0 0 62%; height: 62%; width: 100%; border-left: none; }
            
            /* Su mobile, Mixcloud mette la chat in basso, quindi non serve allargare l'iframe a destra, ma lo allunghiamo per nasconderla in basso */
            #live-frame { width: 100%; height: calc(100% + 400px); }

            /* Il contenitore si adatta quando si alza la tastiera in Fullscreen */
            #fs-input-box { width: 100%; margin-left: 0; margin-bottom: 10px; }
            .fs-controls-bottom { flex-wrap: wrap; }
            #fs-full-chat-overlay { width: calc(100% - 40px); }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- PARTE SINISTRA / SUPERIORE: PLAYER -->
        <div id="video-wrapper" class="player-section">
            
            <!-- Bottoni in alto (nascosti in Fullscreen) -->
            <a href="index.html" class="btn-home hide-in-fs" title="Torna alla Home">🏠</a>
            <a href="https://www.mixcloud.com/live/RossiDJ" target="_blank" class="btn-mixcloud hide-in-fs" id="btn-mixcloud-link" title="Guarda su Mixcloud">☁️ Vai su Mixcloud</a>
            <button class="btn-fullscreen-toggle hide-in-fs" id="btn-fs" onclick="toggleFullscreen()">🔲 Schermo Intero</button>

            <!-- Schermata Offline Automatica -->
            <div id="offline-screen">
                <div class="offline-box">
                    <h2 style="color: #ff0055; margin-top:0;">🔴 DIRETTA OFFLINE</h2>
                    <p style="font-size: 1.2rem; margin-bottom: 10px;">RossiDJ al momento non è in onda.</p>
                    <p style="color: #00d4ff;">Resta nella chat a fare due chiacchiere!</p>
                </div>
            </div>

            <!-- IL CROPPER CHE NASCONDE LA UI DI MIXCLOUD -->
            <div id="iframe-cropper">
                <iframe id="live-frame" src="https://www.mixcloud.com/live/RossiDJ/" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" playsinline webkit-playsinline frameborder="0"></iframe>
            </div>

            <!-- OVERLAY FULLSCREEN -->
            <div id="fs-overlay">
                <!-- Chat Mini: Mostra solo gli ultimi 2 messaggi -->
                <div id="fs-chat-display"></div>
                
                <!-- Chat Completa (Nascosta di default, si apre col tasto) -->
                <div id="fs-full-chat-overlay"></div>

                <!-- Controlli in basso in Fullscreen -->
                <div class="fs-controls-bottom">
                    <div style="display:flex; gap:10px;" id="fs-primary-buttons">
                        <button class="fs-btn-circle" id="btn-toggle-fullchat" onclick="toggleFsFullChat()" title="Mostra tutta la chat">📜</button>
                        <button class="fs-btn-circle" id="fs-btn-open-chat" onclick="openFsInput()" title="Scrivi messaggio">💬</button>
                        <button class="fs-btn-circle" onclick="toggleFullscreen()" style="border-color:#ff0055; color:#ff0055;" title="Esci">❌</button>
                    </div>

                    <div id="fs-input-box">
                        <input type="text" id="fs-input-text" placeholder="Scrivi un messaggio..." autocomplete="off">
                        <button id="fs-btn-send" onclick="sendFsMessage()">Invia</button>
                        <button class="fs-btn-circle" onclick="closeFsInput()" style="padding: 8px; margin-left:5px;">⤵️</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- PARTE DESTRA / INFERIORE: LA TUA CHAT -->
        <div class="chat-section">
            <div class="chat-header">🔴 LIVE CHAT</div>
            <div id="messages-sidebar"></div>
            <div class="chat-input-area">
                <input type="text" id="side-input-text" placeholder="Scrivi nella chat..." autocomplete="off">
                <button id="side-btn-send" onclick="sendSideMessage()">INVIA</button>
            </div>
        </div>

    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyAXFX5kkba800EX9lowCg3os6Ifn2rzd8M", authDomain: "rossidj-chat.firebaseapp.com", databaseURL: "https://rossidj-chat-default-rtdb.europe-west1.firebasedatabase.app", projectId: "rossidj-chat", storageBucket: "rossidj-chat.firebasestorage.app", messagingSenderId: "247840582286", appId: "1:247840582286:web:5320cff622ffc8ab9377df" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUserNick = null;
    let ultimiDueMessaggi = [];

    // --- ACCENSIONE DIRETTA TRAMITE PANNELLO DJ ---
    onValue(ref(db, 'settings/liveStatus'), (snap) => {
        const isLive = snap.val();
        const frame = document.getElementById('live-frame');
        const offlineScreen = document.getElementById('offline-screen');
        const btnFs = document.getElementById('btn-fs');
        const btnMix = document.getElementById('btn-mixcloud-link');
        
        if(isLive) {
            frame.style.display = 'block';
            offlineScreen.style.display = 'none';
            btnFs.style.display = 'block'; 
            btnMix.style.display = 'block'; 
            frame.src = frame.src; 
        } else {
            frame.style.display = 'none';
            offlineScreen.style.display = 'flex';
            btnFs.style.display = 'none'; 
            btnMix.style.display = 'none'; 
            if (document.fullscreenElement) { document.exitFullscreen(); }
        }
    });

    onAuthStateChanged(auth, (user) => {
        if (user) { 
            currentUserNick = user.displayName || user.email.split('@')[0]; 
            document.getElementById('side-input-text').placeholder = "Scrivi nella chat...";
            document.getElementById('fs-input-text').placeholder = "Scrivi un messaggio...";
        } else { 
            currentUserNick = null; 
            document.getElementById('side-input-text').placeholder = "Devi accedere per chattare!";
            document.getElementById('fs-input-text').placeholder = "Devi accedere per chattare!";
        }
    });

    function pubblicaMessaggio(testo) {
        if (!currentUserNick) { alert("Torna alla Home ed effettua l'accesso alla Chat per poter scrivere!"); return; }
        if (testo.trim() !== '') {
            push(ref(db, 'messages'), { user: currentUserNick, text: testo.trim(), timestamp: Date.now(), source: 'web' });
        }
    }

    // Invio da Chat Laterale (Mantiene la tastiera aperta col focus)
    window.sendSideMessage = () => {
        const input = document.getElementById('side-input-text');
        pubblicaMessaggio(input.value);
        input.value = '';
        input.focus(); 
    };
    document.getElementById('side-input-text').addEventListener('keypress', (e) => { if(e.key === 'Enter') window.sendSideMessage(); });

    // Invio da Fullscreen
    window.sendFsMessage = () => {
        const input = document.getElementById('fs-input-text');
        pubblicaMessaggio(input.value);
        input.value = '';
        input.focus();
    };
    document.getElementById('fs-input-text').addEventListener('keypress', (e) => { if(e.key === 'Enter') window.sendFsMessage(); });

    // Gestione Inserimento Messaggi (Le 3 viste della chat)
    onChildAdded(ref(db, 'messages'), (snapshot) => {
        const data = snapshot.val();
        
        // 1. Sidebar Standard
        const sideBox = document.getElementById('messages-sidebar');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'side-msg';
        msgDiv.innerHTML = `<strong>${data.user}</strong> ${data.text}`;
        sideBox.appendChild(msgDiv);
        sideBox.scrollTop = sideBox.scrollHeight;

        // 2. Fullscreen Chat Completa (Senza Sfondo)
        const fsFullBox = document.getElementById('fs-full-chat-overlay');
        const fsFullDiv = document.createElement('div');
        fsFullDiv.className = 'fs-full-msg';
        fsFullDiv.innerHTML = `<strong>${data.user}</strong>: ${data.text}`;
        fsFullBox.appendChild(fsFullDiv);
        fsFullBox.scrollTop = fsFullBox.scrollHeight;

        // 3. Fullscreen Chat Mini (Ultimi 2 messaggi)
        ultimiDueMessaggi.push(data);
        if (ultimiDueMessaggi.length > 2) { ultimiDueMessaggi.shift(); }
        
        const fsMiniBox = document.getElementById('fs-chat-display');
        fsMiniBox.innerHTML = '';
        ultimiDueMessaggi.forEach(msg => {
            const fsDiv = document.createElement('div');
            fsDiv.className = 'fs-msg-mini';
            fsDiv.innerHTML = `<strong>${msg.user}:</strong> ${msg.text}`;
            fsMiniBox.appendChild(fsDiv);
        });
    });

    // --- LOGICA FULLSCREEN E BLOCCO ROTAZIONE SCHERMO ---
    const videoWrapper = document.getElementById('video-wrapper');
    const overlayUI = document.getElementById('fs-overlay');

    window.toggleFullscreen = async () => {
        if (!document.fullscreenElement) {
            try {
                if (videoWrapper.requestFullscreen) { await videoWrapper.requestFullscreen(); }
                else if (videoWrapper.webkitRequestFullscreen) { await videoWrapper.webkitRequestFullscreen(); } 
                
                // Blocca la rotazione (Forza Landscape) quando si entra in Fullscreen su Cellulare
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(e => console.log("Rotazione ignorata."));
                }
            } catch(e) { console.error(e); }
        } else {
            if (document.exitFullscreen) { await document.exitFullscreen(); }
            // Sblocca la rotazione in uscita
            if (screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); }
        }
    };

    document.addEventListener('fullscreenchange', handleFsChange);
    document.addEventListener('webkitfullscreenchange', handleFsChange);

    function handleFsChange() {
        if (document.fullscreenElement) {
            overlayUI.style.display = 'block';
            videoWrapper.classList.add('fullscreen-active');
        } else {
            overlayUI.style.display = 'none';
            videoWrapper.classList.remove('fullscreen-active');
            window.closeFsInput(); 
            document.getElementById('fs-full-chat-overlay').style.display = 'none';
        }
    }

    // --- CONTROLLI UI FULLSCREEN (Scrittura e Visualizzazione) ---
    window.openFsInput = () => {
        document.getElementById('fs-primary-buttons').style.display = 'none';
        document.getElementById('fs-input-box').style.display = 'flex';
        // Breve timeout per permettere alla grafica di adattarsi prima di aprire la tastiera
        setTimeout(() => document.getElementById('fs-input-text').focus(), 100);
    };

    window.closeFsInput = () => {
        document.getElementById('fs-input-box').style.display = 'none';
        document.getElementById('fs-primary-buttons').style.display = 'flex';
    };

    // Alterna tra "Ultimi 2 Messaggi" e "Tutta la Chat"
    window.toggleFsFullChat = () => {
        const fullChat = document.getElementById('fs-full-chat-overlay');
        const miniChat = document.getElementById('fs-chat-display');
        
        if (fullChat.style.display === 'none' || fullChat.style.display === '') {
            fullChat.style.display = 'flex';
            miniChat.style.display = 'none';
            fullChat.scrollTop = fullChat.scrollHeight;
        } else {
            fullChat.style.display = 'none';
            miniChat.style.display = 'flex';
        }
    };
</script>
</body>
</html>
