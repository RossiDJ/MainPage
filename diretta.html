<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>In Diretta - Rossi DJ</title>
    <style>
        /* --- STILI BASE E LAYOUT SPLIT --- */
        body, html { margin: 0; padding: 0; height: 100dvh; width: 100vw; font-family: 'Segoe UI', Arial, sans-serif; background-color: #000; color: #fff; overflow: hidden; }
        
        .main-layout { display: flex; flex-direction: row; height: 100%; width: 100%; }
        
        /* --- PARTE SINISTRA: PLAYER --- */
        .player-section { flex: 1; position: relative; background-color: #000; border-right: 2px solid #ff0055; overflow: hidden; }
        #video-wrapper { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        /* --- LA MASCHERA DI RITAGLIO --- */
        #iframe-cropper { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
        
        #live-frame { 
            position: absolute; 
            border: none; 
            z-index: 1; 
            display: none; 
            top: -65px; 
            left: 0; 
            width: calc(100% + 350px); 
            height: calc(100% + 65px); 
        }

        @media (max-aspect-ratio: 1/1) {
            #live-frame { top: -65px; left: 0; width: 100%; height: calc(100% + 300px); }
        }

        .block-native-fullscreen { position: absolute; bottom: 0; right: 0; width: 150px; height: 60px; z-index: 5; }

        /* --- SCHERMATA OFFLINE ED ELEMENTI UI --- */
        #offline-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('flx10live1.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; z-index: 5; flex-direction: column; }
        .offline-box { background: rgba(0,0,0,0.8); padding: 30px; border-radius: 20px; border: 2px solid #ff0055; text-align: center; backdrop-filter: blur(5px); }

        .btn-home { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: #00d4ff; text-decoration: none; font-size: 1.5rem; padding: 10px; border-radius: 50%; border: 2px solid #00d4ff; z-index: 10; transition: 0.3s; line-height: 1; }
        .btn-mixcloud { position: absolute; top: 15px; left: 75px; background: rgba(0,0,0,0.6); color: #fff; text-decoration: none; padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); z-index: 10; font-weight: bold; display: none; }
        .btn-fullscreen-toggle { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; z-index: 10; font-weight: bold; }
        
        @keyframes pulsateFullscreen { 
            0% { transform: scale(1); box-shadow: 0 0 10px #ff0055; } 
            50% { transform: scale(1.05); box-shadow: 0 0 20px #ff0055; } 
            100% { transform: scale(1); box-shadow: 0 0 10px #ff0055; } 
        }
        .btn-pulsante-fs { 
            animation: pulsateFullscreen 2s infinite; 
            border: 2px solid #ff0055 !important; 
        }

        .fullscreen-active .hide-in-fs { display: none !important; }

        /* --- NUOVO: NUVOLETTA DI BENVENUTO CON TASTO X --- */
        #welcome-toast {
            display: none;
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 212, 255, 0.95);
            color: #000;
            padding: 15px 15px 15px 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.5s ease;
            width: 80%;
            max-width: 300px;
        }
        #close-toast {
            position: absolute;
            top: 5px;
            right: 8px;
            background: transparent;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            color: #000;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            #welcome-toast { display: block; }
        }

        /* --- UI IN FULLSCREEN --- */
        #fs-overlay { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 20; }
        
        #fs-full-chat-overlay { 
            display: flex; 
            position: absolute; 
            top: 35%; 
            right: 2%; 
            bottom: 7%; 
            width: 70%; 
            height: 55%; 
            overflow-y: auto; 
            pointer-events: auto; 
            flex-direction: column; 
            gap: 6px; 
            background: transparent; 
            padding: 15px;
            border-radius: 15px;
            border-right: 3px solid #ff0055;
            backdrop-filter: none;
            transition: all 0.3s ease;
        }

        #fs-full-chat-overlay.minimized-chat {
            top: auto !important;
            bottom: 80px !important;
            height: 90px !important; 
            background: transparent !important; 
            border: 1px solid rgba(255,0,85,0.4);
            backdrop-filter: none !important;
        }

        .fs-full-msg { background: transparent; color: #fff; text-shadow: 1px 1px 3px #000; font-size: 1.05rem; line-height: 1.3; }
        .fs-full-msg strong { color: #00d4ff; }

        .fs-controls-bottom { position: absolute; bottom: 15px; right: 20px; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: flex-end; pointer-events: auto; gap: 10px; width: 100%; }
        
        .fs-btn-circle { background: rgba(0,0,0,0.8); border: 2px solid rgba(255,255,255,0.5); color: #fff; font-size: 1.4rem; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .fs-btn-circle:hover { background: #ff0055; border-color: #ff0055; }
        
        #fs-input-box { display: none; background: rgba(0,0,0,0.9); padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); align-items: center; gap: 8px; width: 300px; }
        #fs-input-text { flex: 1; padding: 10px; border-radius: 8px; border: none; outline: none; font-size: 1rem; }
        #fs-btn-send { background: #00d4ff; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* --- PARTE DESTRA: CHAT LATERALE --- */
        .chat-section { width: 350px; flex-shrink: 0; background-color: rgba(18, 18, 18, 0.95); display: flex; flex-direction: column; position: relative; border-left: 2px solid #ff0055; }
        .chat-header { padding: 15px; background: rgba(0,0,0,0.8); text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); color: #00d4ff; font-weight: bold; letter-spacing: 1px; }
        #messages-sidebar { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .side-msg { background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; border-left: 3px solid #00d4ff; font-size: 0.9rem; word-break: break-word; }
        .side-msg strong { color: #00d4ff; display: block; font-size: 0.8rem; margin-bottom: 3px; }
        
        .chat-input-area { padding: 15px; background: rgba(0,0,0,0.8); border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; flex-shrink: 0; }
        #side-input-text { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #222; color: #fff; font-size: 1rem; }
        #side-btn-send { background: #ff0055; color: #fff; border: none; padding: 12px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        #messages-sidebar, #fs-full-chat-overlay { scroll-behavior: smooth; }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .player-section { width: 100%; height: 40dvh; flex: none; border-right: none; border-bottom: 2px solid #ff0055; }
            .chat-section { width: 100%; height: 60dvh; flex: none; border-left: none; }
            #fs-full-chat-overlay { width: calc(100% - 40px); background: transparent; }
            #fs-input-box { width: 100%; }
        }
        
        #typing-mirror {
            display: none;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #00d4ff;
            z-index: 9999; 
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            pointer-events: auto;
        }
        .mirror-content { flex: 1; text-align: left; word-break: break-word; }
        #typing-mirror strong { color: #00d4ff; font-size: 0.9rem; display: block; margin-bottom: 5px; text-transform: uppercase; }
        #mirror-btn-send { background: #ff0055; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }

        .ios-fake-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
            z-index: 9999 !important;
            border: none !important;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <div id="video-wrapper" class="player-section">

            <div id="typing-mirror">
                <div class="mirror-content">
                    <strong>Stai scrivendo:</strong> <span id="mirror-text">...</span>
                </div>
                <button id="mirror-btn-send">INVIA</button>
            </div>
            
            <a href="index.html" class="btn-home hide-in-fs" title="Torna alla Home">🏠</a>
            <a href="https://www.mixcloud.com/live/RossiDJ" target="_blank" class="btn-mixcloud hide-in-fs" id="btn-mixcloud-link" title="Guarda su Mixcloud">☁️ Vai su Mixcloud</a>
            <button class="btn-fullscreen-toggle hide-in-fs btn-pulsante-fs" id="btn-fs" onclick="toggleFullscreen()">🔲 Schermo Intero</button>

            <div id="welcome-toast">
                <button id="close-toast" onclick="chiudiToast()">✕</button>
                <span style="font-size:1.1rem; color:#ff0055;">Consiglio per Smartphone:</span><br>
                Usa il tasto <strong>"SCHERMO INTERO" 🔲</strong><br><br>
                
                <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; text-align: left; font-size: 0.85rem; display: inline-block;">
                    <strong>Legenda Comandi:</strong><br>
                    ↕️ Riduci/Espandi Chat<br>
                    💬 Mostra/Nascondi Chat<br>
                    ✏️ Scrivi Messaggio<br>
                    ❌ Esci da Schermo Intero
                </div>
                <br><br>Buona visione!
            </div>

           <!-- SCHERMATA OFFLINE CON COUNTDOWN -->
            <div id="offline-screen">
                <div class="offline-box">
                    <h2 style="margin: 0 0 10px 0; color: #00d4ff;">Rossi DJ</h2>
                    <p id="countdown-text" style="font-size: 1.2rem; font-weight: bold; margin: 0; color: #fff;">In caricamento...</p>
                </div>
            </div>

            <div id="iframe-cropper">
                <iframe id="live-frame" src="https://www.mixcloud.com/live/RossiDJ/" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" playsinline webkit-playsinline frameborder="0"></iframe>
                <div class="block-native-fullscreen"></div>
            </div>

            <div id="fs-overlay">
                <div id="fs-full-chat-overlay"></div>

                <div class="fs-controls-bottom">
                    <div style="display:flex; gap:10px;" id="fs-primary-buttons">
                        <button class="fs-btn-circle" onclick="toggleMinimizeFsChat()" title="Riduci/Espandi Chat">↕️</button>
                        <button class="fs-btn-circle" onclick="toggleFsFullChat()" title="Mostra/Nascondi Chat">💬</button>
                        <button class="fs-btn-circle" onclick="openFsInput()" title="Scrivi messaggio">✏️</button>
                        <button class="fs-btn-circle" onclick="toggleFullscreen()" style="border-color:#ff0055; color:#ff0055;" title="Esci da Schermo Intero">❌</button>
                    </div>

                    <div id="fs-input-box">
                        <input type="text" id="fs-input-text" placeholder="Scrivi un messaggio..." autocomplete="off">
                        <button id="fs-btn-send" onclick="sendFsMessage()">Invia</button>
                        <button onclick="closeFsInput()" style="background: rgba(255,0,85,0.8); color: #fff; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;" title="Annulla">❌</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header">🔴 LIVE CHAT</div>
            <div id="messages-sidebar"></div>
            <div class="chat-input-area">
                <input type="text" id="side-input-text" placeholder="Scrivi nella chat..." autocomplete="off">
                <button id="side-btn-send" onclick="sendSideMessage()">INVIA</button>
            </div>
        </div>

    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyAXFX5kkba800EX9lowCg3os6Ifn2rzd8M", authDomain: "rossidj-chat.firebaseapp.com", databaseURL: "https://rossidj-chat-default-rtdb.europe-west1.firebasedatabase.app", projectId: "rossidj-chat", storageBucket: "rossidj-chat.firebasestorage.app", messagingSenderId: "247840582286", appId: "1:247840582286:web:5320cff622ffc8ab9377df" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUserNick = null;
    let countdownInterval = null; 

    window.chiudiToast = () => {
        const toast = document.getElementById('welcome-toast');
        if(toast) toast.style.opacity = '0';
        setTimeout(() => { if(toast) toast.style.display = 'none'; }, 500);
    };

    window.onload = () => {
        const toast = document.getElementById('welcome-toast');
        if(window.innerWidth <= 768) {
            setTimeout(() => { toast.style.opacity = '1'; }, 1000); 
            setTimeout(() => { chiudiToast(); }, 12000); 
        }
    };

    // LISTENER PRINCIPALE AGGIORNATO CON IL COUNTDOWN E AUTO-REFRESH
    onValue(ref(db, 'settings'), (snap) => {
        const data = snap.val() || {};
        
        // Controllo robusto per accertarsi che true venga interpretato correttamente (sia boolean che stringa)
        const isLive = (data.liveStatus === true || String(data.liveStatus) === "true");
        const startTime = Number(data.liveStartTime) || 0;

        const frame = document.getElementById('live-frame');
        const offlineScreen = document.getElementById('offline-screen');
        const btnFs = document.getElementById('btn-fs');
        const btnMix = document.getElementById('btn-mixcloud-link');
        const countdownText = document.getElementById('countdown-text');
        
        clearInterval(countdownInterval);
        
        if (isLive) {
            const now = Date.now();
            
            if (startTime > now) {
                // Modalità Countdown Attiva
                frame.style.display = 'none';
                offlineScreen.style.display = 'flex';
                btnFs.style.display = 'none'; 
                btnMix.style.display = 'none';
                
                const updateCountdown = () => {
                    const currentTime = Date.now();
                    const diff = startTime - currentTime;
                    
                    if (diff <= 0) {
                        clearInterval(countdownInterval);
                        if(countdownText) countdownText.innerHTML = "Avvio della diretta...";
                        setTimeout(() => {
                            // Effettua il refresh completo della pagina come richiesto
                            window.location.reload(true);
                        }, 1000);
                    } else {
                        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const s = Math.floor((diff % (1000 * 60)) / 1000);
                        
                        let timeString = "";
                        if (d > 0) timeString += `${d}g `;
                        timeString += `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                        
                        if(countdownText) countdownText.innerHTML = `La diretta partirà tra<br><span style="font-size:2rem; color:#ff0055;">${timeString}</span>`;
                    }
                };
                
                updateCountdown();
                countdownInterval = setInterval(updateCountdown, 1000);

            } else {
                // Orario superato, parte la diretta
                frame.style.display = 'block';
                offlineScreen.style.display = 'none';
                btnFs.style.display = 'block'; 
                btnMix.style.display = 'block'; 
            }
        } else {
            // Offline
            frame.style.display = 'none';
            offlineScreen.style.display = 'flex';
            btnFs.style.display = 'none'; 
            btnMix.style.display = 'none'; 
            if (countdownText) countdownText.innerHTML = "Trasmissione Offline";
            if (document.fullscreenElement) { document.exitFullscreen().catch(()=>{}); }
        }
    });

    onAuthStateChanged(auth, (user) => {
        if (user) { 
            currentUserNick = user.displayName || user.email.split('@')[0]; 
            document.getElementById('side-input-text').placeholder = "Scrivi nella chat...";
            document.getElementById('fs-input-text').placeholder = "Scrivi un messaggio...";
        } else { 
            currentUserNick = null; 
            document.getElementById('side-input-text').placeholder = "Devi accedere per chattare!";
            document.getElementById('fs-input-text').placeholder = "Devi accedere per chattare!";
        }
    });

    function pubblicaMessaggio(testo) {
        if (!currentUserNick) { alert("Torna alla Home ed effettua l'accesso alla Chat!"); return; }
        if (testo.trim() !== '') {
            push(ref(db, 'messages'), { user: currentUserNick, text: testo.trim(), timestamp: Date.now(), source: 'web' });
        }
    }

    window.sendSideMessage = () => {
        const input = document.getElementById('side-input-text');
        pubblicaMessaggio(input.value);
        input.value = '';
        input.focus(); 
    };
    document.getElementById('side-input-text').addEventListener('keypress', (e) => { if(e.key === 'Enter') window.sendSideMessage(); });

    window.sendFsMessage = () => {
        const input = document.getElementById('fs-input-text');
        pubblicaMessaggio(input.value);
        input.value = '';
        input.focus();
    };
    document.getElementById('fs-input-text').addEventListener('keypress', (e) => { if(e.key === 'Enter') window.sendFsMessage(); });

    onChildAdded(ref(db, 'messages'), (snapshot) => {
        const data = snapshot.val();
        if (!data || !data.user || !data.text) return;
        
        const sideBox = document.getElementById('messages-sidebar');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'side-msg';
        msgDiv.innerHTML = `<strong>${data.user}</strong> ${data.text}`;
        sideBox.appendChild(msgDiv);

        const fsFullBox = document.getElementById('fs-full-chat-overlay');
        const fsFullDiv = document.createElement('div');
        fsFullDiv.className = 'fs-full-msg';
        fsFullDiv.innerHTML = `<strong>${data.user}</strong>: ${data.text}`;
        fsFullBox.appendChild(fsFullDiv);

        setTimeout(() => {
            sideBox.scrollTop = sideBox.scrollHeight;
            fsFullBox.scrollTop = fsFullBox.scrollHeight;
        }, 50);
    });

    const videoWrapper = document.getElementById('video-wrapper');
    const overlayUI = document.getElementById('fs-overlay');
    const fullChatOverlay = document.getElementById('fs-full-chat-overlay');

    window.toggleFullscreen = async () => {
        const isFakeFs = videoWrapper.classList.contains('ios-fake-fullscreen');

        if (!document.fullscreenElement && !document.webkitFullscreenElement && !isFakeFs) {
            try {
                if (videoWrapper.requestFullscreen) {
                    await videoWrapper.requestFullscreen();
                } else if (videoWrapper.webkitRequestFullscreen) {
                    await videoWrapper.webkitRequestFullscreen(); 
                } else {
                    videoWrapper.classList.add('ios-fake-fullscreen');
                    handleFsChange();
                }
            } catch (e) {
                videoWrapper.classList.add('ios-fake-fullscreen');
                handleFsChange();
            }
        } else {
            try {
                if (document.exitFullscreen && document.fullscreenElement) {
                    await document.exitFullscreen();
                } else if (document.webkitExitFullscreen && document.webkitExitFullscreen) {
                    await document.webkitExitFullscreen();
                }
            } catch (e) {
                console.error("Errore uscita schermo intero: ", e);
            }
            videoWrapper.classList.remove('ios-fake-fullscreen');
            handleFsChange();
        }
    };

    document.addEventListener('fullscreenchange', handleFsChange);
    document.addEventListener('webkitfullscreenchange', handleFsChange);

    function handleFsChange() {
        const isRealFs = document.fullscreenElement || document.webkitFullscreenElement;
        const isFakeFs = videoWrapper.classList.contains('ios-fake-fullscreen');

        if (isRealFs || isFakeFs) {
            overlayUI.style.display = 'block';
            videoWrapper.classList.add('fullscreen-active');
            fullChatOverlay.style.display = 'flex';
        } else {
            overlayUI.style.display = 'none';
            videoWrapper.classList.remove('fullscreen-active');
            window.closeFsInput(); 
            fullChatOverlay.style.display = 'none';
            fullChatOverlay.classList.remove('minimized-chat');
        }
    }

    window.openFsInput = () => {
        document.getElementById('fs-primary-buttons').style.display = 'none';
        const inputBox = document.getElementById('fs-input-box');
        inputBox.style.display = 'flex';
        setTimeout(() => document.getElementById('fs-input-text').focus(), 150);
    };

    window.closeFsInput = () => {
        document.getElementById('fs-input-box').style.display = 'none';
        document.getElementById('fs-primary-buttons').style.display = 'flex';
    };

    window.toggleMinimizeFsChat = () => {
        fullChatOverlay.classList.toggle('minimized-chat');
        setTimeout(() => {
            fullChatOverlay.scrollTop = fullChatOverlay.scrollHeight;
        }, 550);
    };

    window.toggleFsFullChat = () => {
        if (fullChatOverlay.style.display === 'none' || fullChatOverlay.style.display === '') {
            fullChatOverlay.style.display = 'flex';
            setTimeout(() => {
                fullChatOverlay.scrollTop = fullChatOverlay.scrollHeight;
            }, 550);
        } else {
            fullChatOverlay.style.display = 'none';
        }
    };

    const typingMirror = document.getElementById('typing-mirror');
    const mirrorText = document.getElementById('mirror-text');
    const fsInputBox = document.getElementById('fs-input-text');
    const sideInputBox = document.getElementById('side-input-text');
    const mirrorBtnSend = document.getElementById('mirror-btn-send');
    
    let activeInputForMirror = null;

    function syncMirror(e) {
        if (window.innerWidth <= 768) {
            mirrorText.textContent = e.target.value || "...";
        }
    }

    function showMirror(e) {
        if (window.innerWidth <= 768) {
            activeInputForMirror = e.target;
            typingMirror.style.display = 'flex';
            mirrorText.textContent = e.target.value || "...";
        }
    }

    function hideMirror() {
        setTimeout(() => {
            typingMirror.style.display = 'none';
        }, 200);
    }

    mirrorBtnSend.addEventListener('click', () => {
        if (activeInputForMirror) {
            if (activeInputForMirror.id === 'fs-input-text') window.sendFsMessage();
            if (activeInputForMirror.id === 'side-input-text') window.sendSideMessage();
            typingMirror.style.display = 'none';
        }
    });

    fsInputBox.addEventListener('input', syncMirror);
    fsInputBox.addEventListener('focus', showMirror);
    fsInputBox.addEventListener('blur', hideMirror);

    sideInputBox.addEventListener('input', syncMirror);
    sideInputBox.addEventListener('focus', showMirror);
    sideInputBox.addEventListener('blur', hideMirror);
</script>
</body>
</html>
