<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vecchie Registrazioni - Rossi DJ</title>
<style>
body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; overflow-x: hidden; }
body::before { content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-image: url('flx10live1.jpg'); background-size: cover; background-position: center; z-index: -1; animation: respiroSfondo 20s ease-in-out infinite alternate; }
@keyframes respiroSfondo { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }
header { width: 100%; padding: 20px 0; background: rgba(0, 0, 0, 0.75); text-align: center; border-bottom: 2px solid #ff9900; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); position: relative; z-index: 1; }
.nav-buttons { margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.btn-nav { padding: 10px 20px; background: #ff9900; color: #fff; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 0.9rem; }
.container { width: 90%; max-width: 800px; margin: 20px auto; background: rgba(0, 0, 0, 0.75); padding: 25px; border-radius: 20px; border: 1px solid #444; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); position: relative; z-index: 1; }
.section-box { background: rgba(0, 0, 0, 0.5); border: 1px solid #444; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
/* Layout in Colonna (Modificato per compatibilità con iOS 12) */
.grid { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
.card { background: rgba(0, 0, 0, 0.6); padding: 15px; border-radius: 12px; border: 1px solid #444; text-align: center; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; width: 100%; box-sizing: border-box; }
.card:hover { transform: translateY(-5px); border-color: #ff9900; background: rgba(0, 0, 0, 0.8); }
.card.attivo { border-color: #ff9900; }
.card-title { font-size: 1.1rem; margin-bottom: 15px; color: #ff9900; font-weight: bold; word-wrap: break-word; }
/* Widget Container */
.widget-container { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; }
/* Barra comandi sotto ogni frame */
.player-bar { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.btn-ctrl { background: rgba(255, 153, 0, 0.15); color: #ff9900; border: 1px solid #ff9900; border-radius: 50px; padding: 8px 14px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
.btn-ctrl:active { background: #ff9900; color: #000; }
.btn-ctrl.play { min-width: 60px; font-size: 1.1rem; }
.tempo { font-size: 0.8rem; color: #aaa; font-variant-numeric: tabular-nums; min-width: 95px; }
.barra { width: 100%; margin-top: 8px; accent-color: #ff9900; }
/* Controlli UI e Pannello DJ */
.btn { padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; margin: 5px; background: #00d4ff; color: #000; }
.btn-danger { background: #ff0055; color: #fff; }
.btn-success { background: #ff9900; color: #fff; }
input, textarea { padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; margin: 5px; width: calc(100% - 20px); box-sizing: border-box; }
textarea { resize: vertical; min-height: 80px; }
#admin-panel { border: 2px solid #ff0055; padding: 15px; margin-top: 20px; display: none; background: rgba(0, 0, 0, 0.85); border-radius: 10px; }
.admin-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #444; text-align: left; flex-wrap: wrap; gap: 10px;}
/* Elemento audio di servizio: fuori vista ma NON display:none (Chrome Android
   sospende la riproduzione degli elementi nascosti del tutto) */
#silent-anchor { position: fixed; bottom: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -1; }
</style>
<script src="https://widget.mixcloud.com/media/js/widgetApi.js"></script>
</head>
<body>
<header>
<h1 style="color:#ff9900; margin:0; text-transform: uppercase;">📼 VECCHIE REGISTRAZIONI</h1>
<div class="nav-buttons">
<a href="index.html" class="btn-nav" style="background-color: #00d4ff; color: #000;">🏠 Home</a>
<a href="videoregistrazioni.html" class="btn-nav" style="background-color: #9900ff; color: #fff;">🎥 Video Set</a>
<a href="live-chat.html" class="btn-nav" style="background-color: #ff0055; color: #fff;">💬 Live Chat</a>
</div>
</header>

<div class="container">
<!-- Pulsante per aprire il Pannello DJ -->
<div style="text-align: right; margin-bottom: 15px;">
<input type="password" id="adminPass" placeholder="Password DJ" style="width: 200px; display: inline-block;">
<button class="btn btn-danger" onclick="checkAdmin()">Pannello DJ</button>
</div>

<!-- Pannello DJ Nascosto -->
<div id="admin-panel">
<h2 style="color:#ff0055; margin-top:0;">🔴 Gestione Registrazioni</h2>
<div class="section-box">
<h4>Aggiungi Nuovo Set</h4>
<input type="text" id="newTitle" placeholder="Titolo del set (es. Live set @ Discoteca)">
<textarea id="newEmbed" placeholder="Incolla qui il codice Embed (&lt;iframe&gt;) di Mixcloud"></textarea>
<button class="btn btn-success" onclick="aggiungiRegistrazione()">Pubblica Registrazione</button>
</div>
<h3>Elenco Registrazioni</h3>
<div id="admin-list">Nessuna registrazione presente.</div>
</div>

<!-- Sezione Pubblica -->
<div class="section-box">
<h3 style="text-align: center; color: #ff9900; margin-top:0;">Riascolta i set precedenti</h3>
<div id="registrazioni-grid" class="grid">
<p style="text-align: center; color: #888;">Caricamento registrazioni in corso...</p>
</div>
</div>
</div>

<!-- Ancora audio silenziosa: serve solo a dare a questa pagina una Media Session
     propria, da mostrare sul display dell'auto. Non produce suono udibile. -->
<audio id="silent-anchor" loop playsinline webkit-playsinline></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const firebaseConfig = { apiKey: "AIzaSyAXFX5kkba800EX9lowCg3os6Ifn2rzd8M", authDomain: "rossidj-chat.firebaseapp.com", databaseURL: "https://rossidj-chat-default-rtdb.europe-west1.firebasedatabase.app", projectId: "rossidj-chat", storageBucket: "rossidj-chat.firebasestorage.app", messagingSenderId: "247840582286", appId: "1:247840582286:web:5320cff622ffc8ab9377df" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let regData = {};
const widgets = {};        // id -> widget Mixcloud
let attivo = null;         // id del set attualmente in riproduzione
let ordine = [];           // id dei set nell'ordine in cui appaiono in pagina
const SALTO = 30;          // secondi di avanti/indietro

// Cosa fanno i tasti "traccia prec./succ." del volante e dell'autoradio:
//   true  -> cambiano set (come i pulsanti ⏮ ⏭ della pagina)
//   false -> saltano di 30s dentro il set in riproduzione
const TASTI_AUTO_CAMBIANO_SET = true;

onValue(ref(db, 'registrazioni'), (snap) => {
  regData = snap.val() || {};
  renderPublic();
  renderAdminList();
});

function estraiSrcDaIframe(iframeString) {
  const match = iframeString.match(/src="([^"]+)"/);
  return match ? match[1] : null;
}

/* ---------- ANCORA SILENZIOSA + MEDIA SESSION ---------- */

// Genera al volo 10 secondi di WAV silenzioso, così non serve caricare
// nessun file audio sul repository.
function creaSilenzio() {
  const rate = 8000, secondi = 10, n = rate * secondi;
  const buf = new ArrayBuffer(44 + n);
  const dv = new DataView(buf);
  const testo = (off, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(off + i, s.charCodeAt(i)); };
  testo(0, 'RIFF'); dv.setUint32(4, 36 + n, true); testo(8, 'WAVE');
  testo(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
  dv.setUint16(22, 1, true); dv.setUint32(24, rate, true); dv.setUint32(28, rate, true);
  dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
  testo(36, 'data'); dv.setUint32(40, n, true);
  for (let i = 0; i < n; i++) dv.setUint8(44 + i, 128); // 128 = silenzio a 8 bit
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

const ancora = document.getElementById('silent-anchor');
ancora.src = creaSilenzio();
ancora.volume = 0.01;

function avviaAncora() {
  const p = ancora.play();
  if (p && p.catch) p.catch(() => {});
}

function aggiornaMediaSession(id) {
  if (!('mediaSession' in navigator)) return;
  const item = regData[id];
  if (!item) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: item.title,
      artist: 'RossiDJ',
      album: 'Vecchie Registrazioni',
      artwork: [{ src: new URL('flx10live1.jpg', location.href).href, sizes: '512x512', type: 'image/jpeg' }]
    });
  } catch (e) {}

  const ms = navigator.mediaSession;
  const set = (azione, fn) => { try { ms.setActionHandler(azione, fn); } catch (e) {} };
  set('play',  () => comando(attivo, 'play'));
  set('pause', () => comando(attivo, 'pause'));
  if (TASTI_AUTO_CAMBIANO_SET) {
    set('previoustrack', () => cambiaSet(-1));
    set('nexttrack',     () => cambiaSet(1));
  } else {
    set('previoustrack', () => comando(attivo, 'indietro'));
    set('nexttrack',     () => comando(attivo, 'avanti'));
  }
  set('seekbackward', e => comando(attivo, 'indietro', (e && e.seekOffset) || SALTO));
  set('seekforward',  e => comando(attivo, 'avanti',   (e && e.seekOffset) || SALTO));
  set('seekto', e => { if (widgets[attivo] && e.seekTime != null) widgets[attivo].seek(e.seekTime); });
}

function statoRiproduzione(stato) {
  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.playbackState = stato; } catch (e) {}
  }
}

/* ---------- RENDER ---------- */

function renderPublic() {
  const grid = document.getElementById('registrazioni-grid');
  grid.innerHTML = '';
  const keys = Object.keys(regData).reverse();
  ordine = keys;

  if (keys.length === 0) {
    grid.innerHTML = '<p style="text-align: center; color: #888;">Nessuna registrazione disponibile al momento.</p>';
    return;
  }

  let html = '';
  keys.forEach(id => {
    const item = regData[id];
    let url = item.src;
    if (url && url.includes('mixcloud.com')) {
      // Mixcloud reindirizza www.mixcloud.com/widget/... a m.mixcloud.com
      // sui dispositivi mobile/riconosciuti come "vecchi", e quel redirect
      // va spesso in errore mostrando solo il logo + link di fallback.
      // Puntando direttamente al sottodominio del player si evita il redirect.
      url = url.replace('https://www.mixcloud.com', 'https://player-widget.mixcloud.com')
               .replace('https://mixcloud.com', 'https://player-widget.mixcloud.com');
      if (!url.includes('hide_cover=1')) {
        url += (url.includes('?') ? '&' : '?') + 'hide_cover=1';
      }
    }

    html += `
    <div class="card" id="card-${id}">
      <div>
        <div class="card-title">🎵 ${item.title}</div>
      </div>
      <div class="widget-container">
        <iframe id="mc-${id}" width="100%" height="120" src="${url}" frameborder="0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" playsinline webkit-playsinline></iframe>
      </div>
      <div class="player-bar">
        <button class="btn-ctrl" onclick="cambiaSet(-1,'${id}')" title="Set precedente">⏮</button>
        <button class="btn-ctrl" onclick="comando('${id}','indietro')">⏪ ${SALTO}s</button>
        <button class="btn-ctrl play" id="pp-${id}" onclick="comando('${id}','toggle')">▶</button>
        <button class="btn-ctrl" onclick="comando('${id}','avanti')">${SALTO}s ⏩</button>
        <button class="btn-ctrl" onclick="cambiaSet(1,'${id}')" title="Set successivo">⏭</button>
      </div>
      <div class="player-bar" style="margin-top:6px;">
        <span class="tempo" id="tempo-${id}">0:00 / 0:00</span>
      </div>
      <input class="barra" type="range" id="barra-${id}" min="0" max="1000" value="0"
             oninput="cercaPosizione('${id}', this.value)">
    </div>`;
  });

  grid.innerHTML = html;
  keys.forEach(id => collegaWidget(id));
}

function collegaWidget(id) {
  const iframe = document.getElementById('mc-' + id);
  if (!iframe || !window.Mixcloud) return;
  const w = Mixcloud.PlayerWidget(iframe);
  widgets[id] = w;
  w.ready.then(() => {
    w.events.play.on(() => segnaPlay(id));
    w.events.pause.on(() => segnaPausa(id));
    w.events.ended.on(() => segnaPausa(id));
    w.events.progress.on((pos, dur) => aggiornaBarra(id, pos, dur));
  }).catch(() => {});
}

function segnaPlay(id) {
  attivo = id;
  avviaAncora();
  aggiornaMediaSession(id);
  statoRiproduzione('playing');
  Object.keys(widgets).forEach(k => {
    const b = document.getElementById('pp-' + k);
    const c = document.getElementById('card-' + k);
    if (b) b.textContent = (k === id) ? '⏸' : '▶';
    if (c) c.className = 'card' + (k === id ? ' attivo' : '');
    if (k !== id && widgets[k]) { try { widgets[k].pause(); } catch (e) {} }
  });
}

function segnaPausa(id) {
  const b = document.getElementById('pp-' + id);
  if (b) b.textContent = '▶';
  if (id === attivo) {
    statoRiproduzione('paused');
    ancora.pause();
  }
}

function aggiornaBarra(id, pos, dur) {
  const barra = document.getElementById('barra-' + id);
  const tempo = document.getElementById('tempo-' + id);
  if (barra && dur) barra.value = Math.round((pos / dur) * 1000);
  if (tempo) tempo.textContent = mmss(pos) + ' / ' + mmss(dur);
  if (id === attivo && 'mediaSession' in navigator && dur) {
    try {
      navigator.mediaSession.setPositionState({ duration: dur, playbackRate: 1, position: Math.min(pos, dur) });
    } catch (e) {}
  }
}

function mmss(s) {
  s = Math.max(0, Math.floor(s || 0));
  const m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

/* ---------- COMANDI ---------- */

window.comando = (id, azione, salto) => {
  const w = widgets[id];
  if (!w) return;
  salto = salto || SALTO;
  if (azione === 'toggle') { avviaAncora(); w.togglePlay(); return; }
  if (azione === 'play')   { avviaAncora(); w.play(); return; }
  if (azione === 'pause')  { w.pause(); return; }
  w.getPosition().then(pos => {
    const nuova = (azione === 'avanti') ? pos + salto : Math.max(0, pos - salto);
    w.seek(nuova);
  }).catch(() => {});
};

// direzione: -1 (precedente) o +1 (successivo).
// partenza: da quale card è stato premuto il tasto (dai comandi dell'auto
// si parte sempre dal set in riproduzione).
window.cambiaSet = (direzione, partenza) => {
  if (ordine.length === 0) return;
  const corrente = partenza || attivo || ordine[0];
  let i = ordine.indexOf(corrente);
  if (i === -1) i = 0;
  const nuovo = ordine[(i + direzione + ordine.length) % ordine.length];
  if (nuovo === corrente && ordine.length === 1) return;

  const vecchio = widgets[corrente];
  if (vecchio) { try { vecchio.pause(); } catch (e) {} }

  avviaAncora();
  const w = widgets[nuovo];
  if (!w) return;
  w.ready.then(() => {
    w.play();
    segnaPlay(nuovo);
    const card = document.getElementById('card-' + nuovo);
    if (card && card.scrollIntoView) card.scrollIntoView({ block: 'center' });
  }).catch(() => {});
};

window.cercaPosizione = (id, valore) => {
  const w = widgets[id];
  if (!w) return;
  w.getDuration().then(dur => {
    if (dur) w.seek((valore / 1000) * dur);
  }).catch(() => {});
};

/* ---------- PANNELLO DJ (invariato) ---------- */

function renderAdminList() {
  const adminList = document.getElementById('admin-list');
  adminList.innerHTML = '';
  const keys = Object.keys(regData).reverse();

  if (keys.length === 0) {
    adminList.innerHTML = '<p>Nessuna registrazione.</p>';
    return;
  }

  keys.forEach(id => {
    const item = regData[id];
    adminList.innerHTML += `
    <div class="admin-row">
      <div style="flex-grow: 1;"><strong>${item.title}</strong></div>
      <button class="btn btn-danger" onclick="eliminaRegistrazione('${id}')">🗑️ Elimina</button>
    </div>`;
  });
}

window.checkAdmin = () => {
  const inputPass = document.getElementById('adminPass').value;
  get(child(ref(db), 'settings/adminPass')).then((snapshot) => {
    if(snapshot.exists() && snapshot.val() === inputPass) {
      document.getElementById('admin-panel').style.display = 'block';
    } else {
      alert("Password DJ errata!");
    }
  });
};

window.aggiungiRegistrazione = () => {
  const title = document.getElementById('newTitle').value.trim();
  const embedCode = document.getElementById('newEmbed').value.trim();
  if (!title || !embedCode) return alert("Inserisci sia il titolo che il codice embed!");
  const src = estraiSrcDaIframe(embedCode);
  if (!src) return alert("Il codice embed non è valido. Assicurati di incollare l'intero tag <iframe> fornito da Mixcloud.");
  push(ref(db, 'registrazioni'), { title: title, src: src })
    .then(() => {
      alert("Registrazione pubblicata con successo!");
      document.getElementById('newTitle').value = '';
      document.getElementById('newEmbed').value = '';
    })
    .catch(e => alert("Errore: " + e.message));
};

window.eliminaRegistrazione = (id) => {
  if (confirm("Vuoi eliminare questa registrazione?")) {
    remove(ref(db, `registrazioni/${id}`));
  }
};
</script>
</body>
</html>
